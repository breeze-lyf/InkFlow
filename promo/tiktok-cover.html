<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="base.css">
<style>
  body { width: 1080px; height: 1920px; padding: 120px 70px; display: flex; flex-direction: column; background: var(--ink-bg); color: #dcd9d0; }
  .hook { text-align: center; margin-bottom: 60px; }
  .hook .q { font-size: 60px; font-weight: 600; line-height: 1.35; }
  .hook .q em { font-style: normal; color: #93a1ff; }
  .hook .s { margin-top: 26px; font-size: 26px; color: #92908a; }
  .frame { flex: 1; border-radius: 22px; overflow: hidden; border: 1px solid rgba(235,230,215,.12); box-shadow: 0 30px 80px rgba(0,0,0,.55); }
  .frame img { width: 100%; height: 100%; object-fit: cover; object-position: top left; }
  .cta { text-align: center; margin-top: 56px; }
  .cta .url { display: inline-block; font-size: 30px; font-weight: 600; color: #93a1ff; background: rgba(147,161,255,.12); border-radius: 999px; padding: 16px 40px; }
  .cta .tip { margin-top: 20px; font-size: 20px; color: #63615b; }
</style></head>
<body>
  <div class="hook">
    <div class="q">Write. It's <em>typeset</em>.<br>Free & open source.</div>
    <div class="s">InkFlow — Markdown editor for macOS · PDF / Word / long-image export</div>
  </div>
  <div class="frame"><img src="shot-dark.png"></div>
  <div class="cta">
    <div class="url">inkflow.yufeng.fun</div>
    <div class="tip">Link in bio · GitHub: breeze-lyf/InkFlow</div>
  </div>
</body></html>

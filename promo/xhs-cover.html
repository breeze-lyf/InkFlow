<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="base.css">
<style>
  body { width: 1080px; height: 1440px; padding: 80px 70px; display: flex; flex-direction: column; }
  .top { text-align: center; margin-bottom: 46px; }
  .logo { display: inline-flex; align-items: center; gap: 14px; margin-bottom: 34px; }
  .logo img { width: 52px; height: 52px; border-radius: 13px; }
  .logo span { font-size: 26px; font-weight: 600; }
  h1 { font-size: 72px; font-weight: 600; line-height: 1.25; letter-spacing: 1px; }
  h1 em { font-style: normal; color: var(--accent); }
  .sub { margin-top: 22px; font-size: 26px; color: var(--t2); }
  .frame { flex: 1; border-radius: 22px; overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow); }
  .frame img { width: 100%; height: 100%; object-fit: cover; object-position: top left; }
  .tags { display: flex; justify-content: center; gap: 14px; margin-top: 40px; }
</style></head>
<body>
  <div class="top">
    <div class="logo"><img src="../assets/brand-mark.png"><span>墨流 InkFlow</span></div>
    <h1>写日报笔记，<br>用它<em>导出长图</em>直接发群</h1>
    <p class="sub">免费 · 开源 · 颜值在线的 Markdown 编辑器</p>
  </div>
  <div class="frame"><img src="shot-light.png"></div>
  <div class="tags"><span class="chip">#效率工具</span><span class="chip">#mac软件</span><span class="chip">#写作神器</span></div>
</body></html>

<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="base.css">
<style>
  body { width: 1080px; height: 1440px; padding: 90px 80px; background: var(--ink-bg); color: #dcd9d0; }
  .no { font-size: 22px; color: #93a1ff; font-weight: 700; letter-spacing: 2px; margin-bottom: 20px; }
  h1 { font-size: 56px; font-weight: 600; line-height: 1.3; margin-bottom: 56px; }
  h1 em { font-style: normal; color: #93a1ff; }
  .list { display: flex; flex-direction: column; gap: 30px; }
  .item { display: flex; gap: 22px; align-items: flex-start; background: var(--ink-card); border: 1px solid rgba(235,230,215,.1); border-radius: 18px; padding: 30px 34px; }
  .ic { flex: 0 0 54px; height: 54px; border-radius: 14px; background: rgba(147,161,255,.13); color: #93a1ff; font-size: 26px; display: flex; align-items: center; justify-content: center; }
  .item h3 { font-size: 27px; font-weight: 600; margin-bottom: 8px; }
  .item p { font-size: 21px; color: #92908a; line-height: 1.6; }
</style></head>
<body>
  <div class="no">InkFlow 墨流 · 02</div>
  <h1>这些<em>痛点</em>，它一次解决</h1>
  <div class="list">
    <div class="item"><div class="ic">⚡</div><div><h3>写完不用再排版</h3><p>边写边渲染，# 号变标题、** 变加粗，所见即所得</p></div></div>
    <div class="item"><div class="ic">📤</div><div><h3>一键导出三件套</h3><p>PDF 交差、Word 给同事、2x 高清长图发群，流程图导出来也是图</p></div></div>
    <div class="item"><div class="ic">🗂</div><div><h3>文档库管理</h3><p>文件夹就是资料库，多页签 + 大纲导航，图片 PDF 点开就预览</p></div></div>
    <div class="item"><div class="ic">🌙</div><div><h3>纸墨双主题</h3><p>白天宣纸、夜晚松烟，深色模式表格也不再刺眼</p></div></div>
  </div>
</body></html>

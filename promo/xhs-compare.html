<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="base.css">
<style>
  body { width: 1080px; height: 1440px; padding: 90px 80px; }
  .no { font-size: 22px; color: var(--accent); font-weight: 700; letter-spacing: 2px; margin-bottom: 20px; }
  h1 { font-size: 56px; font-weight: 600; margin-bottom: 50px; }
  h1 em { font-style: normal; color: var(--accent); }
  table { width: 100%; border-collapse: separate; border-spacing: 0 14px; }
  th { font-size: 22px; color: var(--t2); text-align: left; padding: 12px 20px; }
  td { font-size: 23px; padding: 22px 20px; background: var(--bg-card); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  td:first-child { border-left: 1px solid var(--border); border-radius: 14px 0 0 14px; color: var(--t2); }
  td:last-child { border-right: 1px solid var(--border); border-radius: 0 14px 14px 0; }
  .me { color: var(--accent); font-weight: 600; }
  .y { color: var(--accent); } .n { color: var(--t3); }
  .foot { margin-top: 46px; text-align: center; font-size: 21px; color: var(--t3); }
</style></head>
<body>
  <div class="no">InkFlow 墨流 · 03</div>
  <h1>Typora 的写感，<br><em>零元</em>的价格</h1>
  <table>
    <tr><th style="width:38%"></th><th class="me">墨流</th><th>Typora</th></tr>
    <tr><td>即时渲染写感</td><td class="y">✓</td><td class="y">✓</td></tr>
    <tr><td>文档库 + 多页签</td><td class="y">✓</td><td class="n">—</td></tr>
    <tr><td>导出长图 / Word</td><td class="y">✓</td><td class="n">部分</td></tr>
    <tr><td>价格</td><td class="me">免费开源</td><td>¥89 买断</td></tr>
  </table>
  <p class="foot">inkflow.yufeng.fun · GitHub 搜 InkFlow</p>
</body></html>
